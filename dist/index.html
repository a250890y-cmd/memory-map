<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <title>Memory Map - あなたの旅の記録</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }
      #app {
        display: flex;
        width: 100%;
        height: 100%;
        position: relative;
      }
      /* サイドバー領域（セマンティック構造） */
      .sidebar {
        width: 320px;
        height: 100%;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(12px);
        border-right: 1px solid rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
        z-index: 1000;
        box-shadow: 2px 0 12px rgba(0, 0, 0, 0.04);
      }
      /* 地図メイン領域 */
      .map-container {
        flex: 1;
        height: 100%;
        position: relative;
      }
      #map {
        width: 100%;
        height: 100%;
        background: #e2e8f0;
      }
      /* Leaflet ポップアップのカスタマイズ */
      .custom-memory-popup .leaflet-popup-content-wrapper {
        border-radius: 14px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        padding: 4px;
      }
      .custom-memory-popup .leaflet-popup-content {
        margin: 10px 12px;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BMaHQ7qm.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-3zrLq-MQ.css">
  </head>
  <body>
    <div id="app">
      <!-- サイドバー -->
      <aside id="sidebar" class="sidebar">
        <header class="sidebar-header" style="padding: 1.2rem; border-bottom: 1px solid rgba(0,0,0,0.06);">
          <h2 style="font-size: 1.15rem; font-weight: 700; color: #0f172a;">Memory Map</h2>
        </header>
        <section id="sidebar-content" class="sidebar-content" style="flex: 1; padding: 1.2rem; overflow-y: auto;">
          <div style="font-size: 0.85rem; color: #64748b; line-height: 1.6;">
            <p>地図上のピンをクリックすると、思い出の写真やタイトルを確認できます。</p>
          </div>
        </section>
      </aside>

      <!-- メイン地図領域（画面いっぱいに描画） -->
      <main class="map-container">
        <div id="map"></div>
      </main>
    </div>

    <!-- モーダル用ポータルコンテナ -->
    <div id="modal-container"></div>

    <!-- メインエントリーポイントの読み込み -->
  </body>
</html>
